global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tensies
    # DNS service discovery, not a single static target: under `--scale web=N`
    # the `web` service name resolves to N container IPs. A static_configs target
    # opens one connection per scrape and would hit a single rotating replica,
    # so process-local counters (rolls, WS frames) appear to jump and 2/3 of
    # replicas stay invisible. dns_sd_configs enumerates every A record and
    # scrapes each replica as its own target.
    dns_sd_configs:
      - names: ['web']
        type: A
        port: 8000
    metrics_path: /metrics
    # /metrics is bearer-gated in prod (audit M2). Prometheus reads the same
    # token from a mounted file (write it with:
    #   echo -n "$METRICS_TOKEN" > ops/secrets/metrics_token).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
